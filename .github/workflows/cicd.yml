name: Secure CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  issues: write       
  security-events: write

jobs:
  # JOB 1 - BUILD & TEST
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest test_app.py -v

      - name: Build Docker image
        run: |
          docker build -t secure-cicd-project:latest .
  
  # JOB 2 - SAST SCAN
  sast-scan:
    name: Static Application Security Testing (bandit security scan)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install bandit
        run: | 
          pip install bandit
      
      - name: Run bandit security scan
        run: | 
          bandit -r . -f json -o bandit-report.json || true
      
      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Run Bandit SAST Scan (Enforce High Severity)
        run: |
          bandit -r . --severity-level high
          
   # JOB 3 - SECRET SCANNING
  secret-scan:
    name: Secret Scanning - Trufflehog
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          

      - name: Run Trufflehog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: HEAD~1
          head: HEAD
          extra_args: --only-verified
  
  # JOB 4 - SCA SCAN
  sca-scan:
    name: SCA - Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Safety
        run: pip install safety

      - name: Run Safety Dependency Scan
        run: |
          pip install -r requirements.txt
          safety check -r requirements.txt --output json > safety-report.json || true

      - name: Upload Safety Report
        uses: actions/upload-artifact@v4
        with:
          name: safety-dependency-report
          path: safety-report.json
  
  # JOB 5 - DAST
  dast-scan:
    name: DAST - OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-scan, secret-scan, sca-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Start Flask App
        run: |
          python app.py &
          sleep 5
          curl http://localhost:5000/health

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://host.docker.internal:5000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-I'
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report
          path: report_html.html